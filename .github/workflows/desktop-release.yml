name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts, validate a release, create a draft, or publish
        required: true
        type: choice
        options:
          - build-only
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: ${{ inputs.mode }} desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      previous_bump: ${{ steps.release.outputs.previous_bump }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        env:
          VERSION_FILE: composeApp/Configuration/DesktopVersion.properties
          VERSION_KEY: VERSION_NAME
          VERSION_FIRST_PARENT: "true"
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/desktop-release\.yml|scripts/(generate-release-notes|release-metadata)\.sh)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The desktop version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

      - name: Generate repository release notes
        if: inputs.mode != 'build-only'
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-history \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No desktop repository release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} desktop release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'build-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuvio-linux-${{ steps.release.outputs.version }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Missing required desktop release value: LOCAL_PROPERTIES_BASE64" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install mpv
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev rpm

      - name: Build .deb and .rpm
        run: |
          ./gradlew \
            :composeApp:packageReleaseDeb :composeApp:packageReleaseRpm \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Verify .deb
        run: |
          deb_path="$(ls composeApp/build/compose/binaries/main-release/deb/*.deb 2>/dev/null || true)"
          if [[ -z "${deb_path}" ]]; then
            echo "Expected .deb was not produced under composeApp/build/compose/binaries/main-release/deb/." >&2
            exit 1
          fi
          dpkg-deb --info "${deb_path}" | head -30
          if ! dpkg-deb -f "${deb_path}" Depends | grep -q mpv; then
            echo ".deb is missing the Depends: mpv dependency." >&2
            exit 1
          fi
          if ! dpkg-deb -c "${deb_path}" | grep -q 'usr/share/applications/nuvio-linux.desktop'; then
            echo ".deb is missing the desktop entry." >&2
            exit 1
          fi
          if ! dpkg-deb -c "${deb_path}" | grep -q 'usr/share/icons/hicolor/.*/apps/nuvio-linux.png'; then
            echo ".deb is missing hicolor icons." >&2
            exit 1
          fi

      - name: Verify .rpm
        run: |
          rpm_path="$(ls composeApp/build/compose/binaries/main-release/rpm/*.rpm 2>/dev/null || true)"
          if [[ -z "${rpm_path}" ]]; then
            echo "Expected .rpm was not produced under composeApp/build/compose/binaries/main-release/rpm/." >&2
            exit 1
          fi
          rpm -qpi "${rpm_path}" | head -20
          if ! rpm -qp --requires "${rpm_path}" | grep -q '^mpv'; then
            echo "RPM is missing the Requires: mpv dependency." >&2
            exit 1
          fi
          if ! rpm -qlp "${rpm_path}" | grep -q 'usr/share/applications/nuvio-linux.desktop'; then
            echo "RPM is missing the desktop entry." >&2
            exit 1
          fi
          if ! rpm -qlp "${rpm_path}" | grep -q 'usr/share/icons/hicolor/.*/apps/nuvio-linux.png'; then
            echo "RPM is missing hicolor icons." >&2
            exit 1
          fi

      - name: Upload .deb and .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuvio-linux-${{ needs.metadata.outputs.version }}-linux-x64
          path: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: Linux AppImage
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Missing required desktop release value: LOCAL_PROPERTIES_BASE64" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install mpv
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Install appimagetool
        run: |
          sudo apt-get install -y libfuse2 file
          curl -sL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: |
          APPDIR_APPIMAGETOOL=/usr/local/bin/appimagetool \
            ./dist/appimage/build-appimage.sh

      - name: Verify AppImage
        run: |
          appimage_path="$(ls nuvio-linux-*.AppImage 2>/dev/null || true)"
          if [[ -z "${appimage_path}" ]]; then
            echo "Expected .AppImage was not produced." >&2
            exit 1
          fi
          file "${appimage_path}"
          if ! APPIMAGE_EXTRACT_AND_RUN=1 "${appimage_path}" --appimage-extract "*.desktop" >/dev/null 2>&1; then
            echo "Could not extract the AppImage desktop entry." >&2
            exit 1
          fi
          if ! grep -q '^Name=Nuvio Linux AppImage$' squashfs-root/nuvio-linux.desktop; then
            echo "AppImage desktop entry is not named 'Nuvio Linux AppImage'." >&2
            exit 1
          fi
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuvio-linux-${{ needs.metadata.outputs.version }}-appimage-x64
          path: nuvio-linux-*.AppImage
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Linux Flatpak
    if: inputs.mode != 'dry-run'
    needs: metadata
    # SECURITY NOTE (accepted risk, documented): this job runs on a self-hosted
    # runner because the ffmpeg/libplacebo/libmpv source builds time out on
    # 2-core GitHub-hosted runners. Self-hosted runners are not ephemeral and
    # their operator controls the machine, and the job decodes
    # NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 (which contains TRAKT_CLIENT_SECRET,
    # NUVIO_SUPABASE_ANON_KEY, SIMKL_CLIENT_ID, ...) into local.properties to
    # compile the same binary every other job builds. Treat the runner host as
    # a privileged trust boundary: only run flatpak jobs from repository
    # collaborators, and audit the runner image regularly. (These values are
    # client-side OAuth/anon credentials and end up extractable from every
    # shipped binary anyway; the exposure being limited is the self-hosted
    # machine itself, not the artifacts.)
    runs-on: [self-hosted, linux, x64]
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Missing required desktop release value: LOCAL_PROPERTIES_BASE64" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install Flatpak tooling and runtimes
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08
          command -v flatpak-builder || {
            echo "flatpak-builder is required on the self-hosted runner." >&2
            exit 1
          }

      - name: Build Flatpak
        run: |
          ./dist/flatpak/build-flatpak.sh

      - name: Verify Flatpak
        run: |
          bundle_path="$(ls dist/flatpak/nuvio-linux-*.flatpak 2>/dev/null || true)"
          if [[ -z "${bundle_path}" ]]; then
            echo "Expected .flatpak bundle was not produced." >&2
            exit 1
          fi
          flatpak install --user -y "${bundle_path}"

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuvio-linux-${{ needs.metadata.outputs.version }}-flatpak
          path: dist/flatpak/nuvio-linux-*.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create ${{ inputs.mode }} release
    if: inputs.mode != 'build-only' && inputs.mode != 'dry-run'
    needs:
      - metadata
      - linux
      - appimage
      - flatpak
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.release_commit }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nuvio-linux-${{ needs.metadata.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          if [[ ! -s release/release-notes.md ]]; then
            echo "Release notes are missing." >&2
            exit 1
          fi

          release_assets=(
            $(ls release/*.deb 2>/dev/null || true)
            $(ls release/*.rpm 2>/dev/null || true)
            $(ls release/*.AppImage 2>/dev/null || true)
            $(ls release/*.flatpak 2>/dev/null || true)
          )
          if (( ${#release_assets[@]} == 0 )); then
            echo "No release assets found under release/." >&2
            exit 1
          fi

          : > release/SHA256SUMS.txt
          for asset in "${release_assets[@]}"; do
            checksum="$(sha256sum "${asset}" | awk '{print $1}')"
            printf '%s  %s\n' "${checksum}" "$(basename "${asset}")" >> release/SHA256SUMS.txt
          done

          cat release/SHA256SUMS.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        run: |
          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_VERSION}"
            --notes-file release/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create --repo "${GITHUB_REPOSITORY}" "${release_args[@]}" \
            release/*.deb \
            release/*.rpm \
            release/*.AppImage \
            release/*.flatpak \
            "release/SHA256SUMS.txt"
