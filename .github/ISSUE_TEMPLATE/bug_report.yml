name: Bug report
description: Report a reproducible app bug (one per issue).
title: "[Bug]: short summary here"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Nuvio Linux (alpha) and taking the time to report.

        **Reports with data get fixed; reports without data usually can't be reproduced.** Please fill this out with real information from your system — not just a sentence describing the problem. If we can reproduce it, we can usually fix it.

        Please replace the default title with a short summary of the actual problem.
        Vague reports such as "not working", "broken", or "same issue" may be labeled `needs-info` and closed after 1 day if the missing details are not added.
        Reports left open for more than 30 days may be closed as stale.

        > **Using a Nuvio online account and seeing login/library/sync weirdness?**
        > **Log out and sign back in first** (Settings → Account → Account and Sync Status → Sign Out). It rebuilds credentials and re-syncs library state, and resolves most account-related reports on its own.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest release.
          required: true
        - label: This issue is limited to a single bug (not multiple unrelated problems).
          required: true
        - label: This is not a source/stream-specific error (the issue happens regardless of which source is used).
          required: true

  - type: markdown
    attributes:
      value: |
        ## Your setup

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in About, or the release tag you installed.
      placeholder: "e.g. 0.1.20-alpha-4"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Package format
      options:
        - Arch / AUR (nuvio-linux-bin)
        - Arch / AUR (nuvio-linux-git)
        - DEB (.deb)
        - RPM (.rpm)
        - AppImage
        - Flatpak
        - Built from source
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: gpu_vendor
    attributes:
      label: GPU vendor
      description: Hardware decode and rendering paths differ per vendor.
      options:
        - AMD
        - NVIDIA
        - Intel (integrated)
        - Intel (discrete Arc)
        - Multiple GPUs (laptop hybrid — please describe below)
        - Other / unknown
    validations:
      required: true

  - type: input
    id: gpu_driver
    attributes:
      label: GPU model & driver
      description: "`nvidia-smi`, `lspci | grep -i vga`, or `glxinfo | grep renderer` output."
      placeholder: "e.g. RTX 3060 Ti, driver 610.57.04 / RX 9070 XT, Mesa 26.2.1"
    validations:
      required: true

  - type: input
    id: desktop_environment
    attributes:
      label: Desktop environment & session type
      description: Whether you run X11 or Wayland matters a lot for windowing/rendering bugs.
      placeholder: "e.g. KDE Plasma 6 (Wayland) / Hyprland (Wayland) / GNOME (X11)"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Distro & kernel
      placeholder: "e.g. CachyOS (kernel 7.2) / Fedora 42 / Ubuntu 24.04"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## What happened?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest match. It helps triage.
      options:
        - Playback (stutter / judder / lag / frame drops)
        - Playback (start/stop/buffering/errors)
        - Hardware decoding (hwdec, VA-API/NVDEC)
        - Streams / Sources (selection, loading, errors)
        - Trailer previews (hero/hover)
        - P2P / Torrent playback
        - Watch Progress (resume, watched state, history)
        - Subtitles (download, styling, sync)
        - Audio tracks
        - Windowing / Fullscreen / Tiling WM
        - Keyboard / Mouse input
        - Navigation / UI layout
        - Settings
        - Sync (Nuvio account / Trakt / Simkl)
        - Downloads / Offline
        - Installer / Updater
        - Discord Rich Presence
        - Crash (app closes unexpectedly)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: |
        Explain the problem in detail. Do not only write "not working" or "same issue".
        Include what screen/flow you were using, what you clicked or tried to do, what changed on screen, and any visible error text.
      placeholder: |
        I was trying to ...
        The app ...
        I saw ...
        This happens on ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, one action per line. If it depends on specific content, describe it (movie/series, season/episode, source/addon name) without sharing private links.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Click / type ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "What actually happened? Include any on-screen error text/codes and whether the app froze, crashed, ignored input, showed the wrong content, stuttered, dropped frames, etc."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often (more than 50%)
        - Sometimes
        - Rarely
        - Once
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - Not sure
        - Yes, it used to work (please name the version that worked)
        - No, it never worked
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Debug log

  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        **Required for crashes and playback problems (stutter/lag/frame drops) — these reports cannot be diagnosed without it.**

        Launch the app from a terminal with debug logging, reproduce the problem (~30 seconds for playback issues, without seeking), quit, and paste the output:

        ```
        # Native packages (Arch/deb/rpm/AppImage):
        NUVIO_MPV_DEBUG=1 nuvio-linux > ~/nuvio-debug.log 2>&1

        # Flatpak:
        flatpak run --env=NUVIO_MPV_DEBUG=1 io.github.jjdizz1l.NuvioLinux > ~/nuvio-debug.log 2>&1
        ```

        For **crashes**, also run `coredumpctl info nuvio-linux` after the crash and include its stack trace.

        The most valuable lines: `readback stats[...]`, `render cadence: ...`, `consumer stats:`, `hwdec-current = ...`, `render context created (...)`, `[gl-init] ...`.
      render: shell
      placeholder: |
        Paste the debug log here
    validations:
      required: true

  - type: textarea
    id: media_details
    attributes:
      label: Media details (optional)
      description: Only include what you can safely share.
      placeholder: |
        - Content type: series/movie
        - Season/Episode: S1E2
        - Stream/source: (addon name / source label, torrent vs direct link)
        - Video format/resolution: (if known, e.g. HEVC 1080p24)
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots/screen recordings, related issues, workarounds you tried, custom mpv.conf settings.
    validations:
      required: false
