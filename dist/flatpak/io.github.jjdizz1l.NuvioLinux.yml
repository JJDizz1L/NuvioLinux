id: io.github.jjdizz1l.NuvioLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: nuvio
rename-desktop-file: nuvio-linux.desktop
rename-icon: nuvio-linux
separate-locales: false

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home/.config/mpv:ro
  - --filesystem=home/.mpv:ro
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-run/discord-ipc-0:ro
  - --filesystem=xdg-run/vesktop-ipc-0:ro
  - --filesystem=xdg-run/app/com.discordapp.Discord/discord-ipc-0:ro
  - --filesystem=xdg-run/snap.discord/discord-ipc-0:ro

build-options:
  arch:
    x86_64:
      env:
        CFLAGS: -O2 -march=x86-64 -mtune=generic
        CXXFLAGS: -O2 -march=x86-64 -mtune=generic

modules:
  - name: fribidi
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
        sha256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c

  - name: libass
    buildsystem: meson
    config-opts:
      - -Dasm=disabled
      - -Dfontconfig=enabled
      - -Dtest=false
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-doc --disable-debug --disable-avdevice
        --disable-postproc --disable-swscale --disable-network --disable-everything
        --enable-protocol=file,http,https,tcp,tls --enable-demuxer=matroska,avi,mp4,mov,mpegts,webm_dash_manifest
        --enable-parser=h264,hevc,aac,mp3,ac3,vp9,av1
        --enable-decoder=h264,hevc,aac,mp3,ac3,eac3,opus,vorbis,vp9,av1,flac
        --enable-encoder=png --enable-ffmpeg --disable-ffplay --disable-ffprobe
        --enable-pthreads --enable-gpl --enable-version3 --disable-x86asm
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
      - -Dshaderc=disabled
      - -Dglslang=disabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: hwdata
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.394.tar.gz
        sha256: b7c3fd7214a3b7c49d2661db127a712dc11cffd1799f793947aa1cb20aaf3298

  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
        sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b

  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dlibbluray=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dopenal=disabled
      - -Drubberband=disabled
      - -Duchardet=disabled
      - -Dvapoursynth=disabled
      - -Dvulkan=disabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Degl=enabled
      - -Ddrm=enabled
      - -Dvaapi=enabled
      - -Dgbm=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dwerror=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: nuvio
    buildsystem: simple
    build-commands:
      - cp -a /run/build/nuvio/nuvio-src/Nuvio /app/nuvio
      - mkdir -p /app/bin
      - cp /run/build/nuvio/nuvio-src/nuvio /app/bin/nuvio
      - chmod +x /app/bin/nuvio
      - install -Dm644 /run/build/nuvio/nuvio-src/nuvio-linux.desktop /app/share/applications/nuvio-linux.desktop
      - install -Dm644 /run/build/nuvio/nuvio-src/nuvio-linux.png /app/share/icons/hicolor/512x512/apps/nuvio-linux.png
    sources:
      - type: dir
        path: flatpak-src
        dest: nuvio-src
