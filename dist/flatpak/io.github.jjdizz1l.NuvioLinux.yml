id: io.github.jjdizz1l.NuvioLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: nuvio-linux
rename-desktop-file: nuvio-linux.desktop
rename-icon: nuvio-linux
separate-locales: false

add-extensions:
  org.freedesktop.Platform.VAAPI.Intel:
    version: '25.08'
    directory: lib/intel-vaapi-driver
    download-if: have-intel-gpu
    enable-if: have-intel-gpu

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.PowerManagement
  - --filesystem=home/.config/mpv:ro
  - --filesystem=home/.mpv:ro
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-run/discord-ipc-0:ro
  - --filesystem=xdg-run/vesktop-ipc-0:ro
  - --filesystem=xdg-run/app/com.discordapp.Discord/discord-ipc-0:ro
  - --filesystem=xdg-run/snap.discord/discord-ipc-0:ro

build-options:
  arch:
    x86_64:
      env:
        CFLAGS: -O2 -march=x86-64 -mtune=generic
        CXXFLAGS: -O2 -march=x86-64 -mtune=generic

modules:
  - name: fribidi
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
        sha256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c

  - name: libass
    buildsystem: meson
    config-opts:
      - -Dasm=disabled
      - -Dfontconfig=enabled
      - -Dtest=false
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: openssl
    buildsystem: simple
    build-commands:
      - ./Configure --prefix=/app --openssldir=/etc/ssl no-shared no-tests no-docs no-module no-legacy
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install_sw
    sources:
      - type: archive
        url: https://www.openssl.org/source/openssl-3.4.1.tar.gz
        sha256: 002a2d6b30b58bf4bea46c43bdd96365aaf8daa6c428782aa4feee06da197df3

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-doc --disable-debug
        --disable-postproc --disable-everything
        --enable-shared --enable-network --enable-openssl
        --enable-protocol=file,http,https,tcp,tls,crypto
        --enable-demuxer=matroska,webm,avi,mp4,mov,m4v,mpegts,mpeg,mpegvideo,flv,webm_dash_manifest,hls,ogg,wav,w64,aiff,ac3,eac3,dts,dtshd,truehd,aac,asf,asf_o,mp3,flac,ape,wv,caf,gif,subreader,ass,srt,webvtt
        --enable-parser=h264,hevc,vp9,av1,vp8,mpeg4video,mpegvideo,aac,aac_latm,ac3,dca,eac3,flac,mpegaudio,opus,ogg,vorbis,truehd,mlp,vc1
        --enable-decoder=h264,hevc,vp9,av1,vp8,vp6f,mpeg2video,mpeg4,msmpeg4v2,msmpeg4v3,wmv3,vc1,h263,mjpeg
        --enable-decoder=aac,aac_fixed,aac_latm,ac3,ac3_fixed,eac3,dca,truehd,mlp,mp1,mp1float,mp2,mp2float,mp3,mp3float,mp3adu,flac,alac,opus,vorbis,wmav1,wmav2,wmapro,wmalossless,wmavoice
        --enable-decoder=pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_f32le,pcm_f32be,pcm_f64le,pcm_u8,pcm_s8,pcm_alaw,pcm_mulaw,adpcm_ima_wav,adpcm_ms,adpcm_yamaha,gsm,gsm_ms,speex
        --enable-decoder=mov_text,ass,subrip,webvtt
        --enable-hwaccel=h264_vaapi,hevc_vaapi,vp9_vaapi,av1_vaapi
        --enable-encoder=png --enable-ffmpeg --disable-ffplay --disable-ffprobe
        --enable-pthreads --enable-gpl --enable-version3 --disable-x86asm
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
      - -Dshaderc=disabled
      - -Dglslang=disabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: hwdata
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.394.tar.gz
        sha256: b7c3fd7214a3b7c49d2661db127a712dc11cffd1799f793947aa1cb20aaf3298

  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
        sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b

  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dlibbluray=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dopenal=disabled
      - -Drubberband=disabled
      - -Duchardet=disabled
      - -Dvapoursynth=disabled
      - -Dvulkan=disabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Degl=enabled
      - -Ddrm=enabled
      - -Dvaapi=enabled
      - -Dvaapi-drm=enabled
      - -Dvaapi-x11=enabled
      - -Dvaapi-wayland=enabled
      - -Dcuda-hwaccel=enabled
      - -Dcuda-interop=enabled
      - -Dgbm=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dwerror=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: nuvio-linux
    buildsystem: simple
    build-commands:
      - cp -a /run/build/nuvio-linux/nuvio-src/nuvio-app /app/nuvio
      - mkdir -p /app/bin /app/lib/intel-vaapi-driver
      - cp /run/build/nuvio-linux/nuvio-src/nuvio-linux /app/bin/nuvio-linux
      - chmod +x /app/bin/nuvio-linux
      - install -Dm644 /run/build/nuvio-linux/nuvio-src/nuvio-linux.desktop /app/share/applications/nuvio-linux.desktop
      - install -Dm644 /run/build/nuvio-linux/nuvio-src/nuvio-linux.png /app/share/icons/hicolor/512x512/apps/nuvio-linux.png
      - install -Dm644 /run/build/nuvio-linux/nuvio-src/io.github.jjdizz1l.NuvioLinux.metainfo.xml /app/share/metainfo/io.github.jjdizz1l.NuvioLinux.metainfo.xml
    sources:
      - type: dir
        path: flatpak-src
        dest: nuvio-src
